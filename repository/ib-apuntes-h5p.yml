key: apuntes-h5p
name: Apuntes · Contenido H5P
category: apuntes
order: a10
icon: fa fa-puzzle-piece
instructions: >
  Pone un H5P en los apuntes, dentro de su contenedor y con el texto alternativo obligatorio (qué se practica: el apunte
  debe entenderse aunque el H5P no cargue). Si ya tienes la URL del H5P, pégala aquí. Si no: acepta, pulsa el recuadro
  «H5P pendiente» y después el botón H5P del editor; desde ahí puedes elegirlo del Banco de contenido (donde se crea
  con el editor de H5P de Moodle: Banco de contenido > Añadir), subir un .h5p o pegar una URL.
engine: ejs
template: |
  <p><%= alternativo %></p>
  <div class="h5p-container" data-widget="apuntes-h5p">
  <div class="h5p-placeholder" contenteditable="false"<% if (!url) { %> data-apuntes-pendiente="1"<% } %>><%= url || 'H5P pendiente: pulsa este recuadro y después el botón H5P del editor' %></div>
  </div>
  <p><br></p>
selectors: div.h5p-container[data-widget="apuntes-h5p"]
parameters:
  - name: alternativo
    title: Texto visible antes del H5P (qué se practica)
    type: textarea
    value: Practica … con unas preguntas breves. Si no se carga, repasa el apartado anterior.
  - name: url
    title: URL del H5P (opcional; si la dejas vacía, usa después el botón H5P del editor)
    value: ""
    bind:
      getValue: |
        (el) => {
          const p = el.querySelector('.h5p-placeholder');
          return p && !p.hasAttribute('data-apuntes-pendiente') ? p.textContent.trim() : '';
        }
      setValue: |
        (el, v) => {
          const p = el.querySelector('.h5p-placeholder');
          if (!p) { return; }
          if (v) { p.textContent = v; p.removeAttribute('data-apuntes-pendiente'); }
          else { p.textContent = 'H5P pendiente: pulsa este recuadro y después el botón H5P del editor'; p.setAttribute('data-apuntes-pendiente', '1'); }
        }
contextmenu:
  - actions: cut | remove
author: Kit scorm2libro
version: 2.0.0
