key: apuntes-desplegable
name: Apuntes · Desplegable (pista, solución o ampliación)
category: apuntes
order: a05
icon: fa fa-caret-square-o-down
instructions: >
  Desplegable nativo <details>/<summary>, sin JavaScript. Úsalo solo para pistas, soluciones breves o ampliaciones:
  el contenido esencial debe quedar visible.
template: |
  <details data-widget="apuntes-desplegable">
    <summary>{{resumen}}</summary>
    <p>Escribe aquí la pista, la solución breve o la ampliación.</p>
  </details>
  <p><br></p>
selectors: details[data-widget="apuntes-desplegable"]
parameters:
  - name: resumen
    title: Texto visible del desplegable
    value: Ver pista
    tooltip: "Ejemplos: Ver pista, Ver respuesta orientativa, Ampliación: …"
    bind: text('summary')
contextmenu:
  - actions: printable | cut | remove
author: Kit scorm2libro
version: 1.0.0
