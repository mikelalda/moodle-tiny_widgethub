key: apuntes-limpiar
name: Apuntes · Limpiar formato pegado
category: apuntes
order: a91
icon: fa fa-eraser
instructions: >
  Quita lo que suele traer el texto pegado desde Word, Google Docs o un SCORM dentro del contenedor de los apuntes:
  estilos en línea, fuentes y colores, spans y párrafos vacíos; cambia b/i por strong/em. Quita también el
  recuadro de «Revisar la página».
filter: >
  Array.prototype.slice.call(body.querySelectorAll('[data-apuntes-informe]')).forEach(function (el) { el.parentNode.removeChild(el); });
  var raiz = body.querySelector('.apuntes-moodle') || body;
  var cambios = 0;
  Array.prototype.slice.call(raiz.querySelectorAll('[style]')).forEach(function (el) {
    el.removeAttribute('style'); el.removeAttribute('data-mce-style'); cambios++;
  });
  Array.prototype.slice.call(raiz.querySelectorAll('font, span:not([class])')).forEach(function (el) {
    var padre = el.parentNode;
    while (el.firstChild) { padre.insertBefore(el.firstChild, el); }
    padre.removeChild(el); cambios++;
  });
  [['b', 'strong'], ['i', 'em']].forEach(function (par) {
    Array.prototype.slice.call(raiz.querySelectorAll(par[0])).forEach(function (el) {
      var nuevo = document.createElement(par[1]);
      while (el.firstChild) { nuevo.appendChild(el.firstChild); }
      el.parentNode.replaceChild(nuevo, el); cambios++;
    });
  });
  Array.prototype.slice.call(raiz.querySelectorAll('p')).forEach(function (p, i, lista) {
    var vacio = !p.textContent.replace(/ /g, ' ').trim() && !p.querySelector('img, iframe, br[data-mce-bogus]');
    if (vacio && i < lista.length - 1) { p.parentNode.removeChild(p); cambios++; }
  });
  return [cambios > 0, cambios > 0 ? 'Formato limpiado: ' + cambios + ' cambios.' : 'No había formato que limpiar.'];
author: Kit scorm2libro
version: 1.0.0
