key: apuntes-ejemplo-resuelto
name: Apuntes · Ejemplo resuelto por subobjetivos
category: apuntes
order: a06
icon: fa fa-check-square-o
instructions: >
  Estructura de un ejemplo resuelto: problema, subobjetivos (qué se hace y por qué) y resultado esperado
  (reglas 9 y 10 de las reglas pedagógicas).
engine: ejs
template: |
  <h2>Ejemplo resuelto: <%= titulo %></h2>
  <p><strong>Problema:</strong> qué se quiere conseguir y con qué datos.</p>
  <% for (var i = 1; i <= n; i++) { %>
  <h3>Subobjetivo <%= i %>: …</h3>
  <p>Qué se hace y por qué.</p>
  <% } %>
  <p><strong>Resultado esperado:</strong> …</p>
  <p><br></p>
parameters:
  - name: titulo
    title: Tema del ejemplo
    value: …
  - name: 'n'
    title: Número de subobjetivos
    value: 3
    min: 1
    max: 8
author: Kit scorm2libro
version: 1.0.0
