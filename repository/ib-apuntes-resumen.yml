key: apuntes-resumen
name: Apuntes · Resumen operativo
category: apuntes
order: a15
icon: fa fa-list-ul
instructions: >
  Cierre de la página: las ideas que el estudiante debe llevarse, sin contenido nuevo.
engine: ejs
template: |
  <h2>Resumen operativo</h2>
  <ul data-widget="apuntes-resumen">
  <% for (var i = 1; i <= n; i++) { %>  <li>Idea clave <%= i %> (sin contenido nuevo).</li>
  <% } %></ul>
  <p><br></p>
selectors: ul[data-widget="apuntes-resumen"]
parameters:
  - name: 'n'
    title: Número de ideas
    value: 4
    min: 2
    max: 10
contextmenu:
  - predicate: li
    actions: moveup movedown insertafter | remove
author: Kit scorm2libro
version: 1.0.0
